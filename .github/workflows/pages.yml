name: Publicar SENAVENTAS en GitHub Pages

# Publica la tienda en la raíz del sitio y SENA VENTAS LANDING PAGE en /landing/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generar versión portable (un solo archivo HTML)
        run: node tools/build-portable.mjs
      - name: Generar versión portable de SENA VENTAS LANDING PAGE
        run: node landing/tools/build-portable.mjs
      - name: Preparar sitio
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js .nojekyll assets dist referencias _site/
          mkdir -p _site/landing
          cp -r landing/index.html landing/ver.html landing/config.js landing/manifest.webmanifest landing/sw.js landing/assets landing/dist _site/landing/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
