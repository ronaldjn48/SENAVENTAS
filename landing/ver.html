<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cargando landing page...</title>
<meta name="description" content="Landing page creada con SENA VENTAS LANDING PAGE.">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; height: 100%; background: #f8f9ff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #0b1c30; }
  #lp { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  #lp[hidden] { display: none; }
  #msg { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; text-align: center; }
  .spin { width: 42px; height: 42px; border-radius: 99px; border: 4px solid #d3e4fe; border-top-color: #007a3d; animation: r 0.9s linear infinite; margin: 0 auto 14px; }
  @keyframes r { to { transform: rotate(360deg); } }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 10px 40px -18px rgba(11, 28, 48, .35); padding: 28px; max-width: 460px; }
  .card h1 { font-size: 20px; margin: 10px 0; }
  .card p { color: #3f493f; line-height: 1.5; }
  .card a { display: inline-block; margin-top: 12px; background: #007a3d; color: #fff; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: 600; }
  .ico { width: 48px; height: 48px; border-radius: 99px; background: #ffdad6; color: #ba1a1a; font-weight: 800; font-size: 24px; display: flex; align-items: center; justify-content: center; margin: 0 auto; }
</style>
</head>
<body>
<div id="msg"><div><div class="spin"></div><p>Cargando la landing page...</p></div></div>
<iframe id="lp" title="Landing page" hidden sandbox="allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads"></iframe>
<noscript><p style="text-align:center">Esta página necesita JavaScript habilitado.</p></noscript>
<script src="config.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/art.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/cloud.js"></script>
<script src="assets/js/viewer.js"></script>
</body>
</html>
