<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SENA VENTAS LANDING PAGE · Creador de Landing Pages</title>
<meta name="description" content="Simulador educativo para crear landing pages de captación de clientes con formulario, WhatsApp Business, base de datos en Excel y enlace público funcional.">
<meta name="theme-color" content="#005f2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SENA Landing">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<aside class="side" id="side" aria-label="Menú principal">
  <div class="side-top">
    <div class="logo">
      <div class="logo-mark"><span class="ms fill">ads_click</span></div>
      <div><b>SENA VENTAS</b><small>Landing Page</small></div>
    </div>
    <div class="prog" id="progress" data-a="go" data-route="inicio" title="Ver ruta de aprendizaje"></div>
    <nav class="nav" id="nav"></nav>
  </div>
  <div class="user" id="user-card" data-a="edit-owner" title="Editar ficha del aprendiz"></div>
</aside>
<div class="side-scrim" data-a="close-side"></div>

<header class="top">
  <div class="top-l">
    <button class="icon-btn menu-btn" data-a="open-side" aria-label="Abrir menú"><span class="ms">menu</span></button>
    <span class="sandbox-chip"><span class="dot"></span><span class="lbl">Modo Aprendizaje / Captación de Leads</span></span>
    <div class="vsep hide-sm"></div>
    <div class="ses-name" id="ses-name"></div>
  </div>
  <div class="top-r">
    <button class="btn btn-soft btn-sm hide" id="install-btn" data-a="install"><span class="ms sm">install_desktop</span><span class="hide-sm">Instalar app</span></button>
    <button class="icon-btn" data-a="save-now" title="Guardar ahora (Ctrl+S)"><span class="ms">save</span></button>
    <button class="icon-btn" data-a="help" title="Guía rápida"><span class="ms">help</span></button>
    <button class="icon-btn" data-a="activity" title="Actividad del proyecto"><span class="ms">notifications</span><i class="notif-dot hide" id="notif-dot"></i></button>
  </div>
</header>

<main class="view" id="view" tabindex="-1">
  <div class="empty"><span class="ms">hourglass_top</span><p>Cargando SENA VENTAS LANDING PAGE...</p></div>
</main>

<nav class="bnav" id="bnav" aria-label="Navegación móvil"></nav>
<div id="overlay-root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<noscript><p style="padding:100px 20px;text-align:center">SENA VENTAS LANDING PAGE necesita JavaScript habilitado.</p></noscript>

<script src="config.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/art.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/cloud.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/editor.js"></script>
<script src="assets/js/leads.js"></script>
<script>SV.app.boot();</script>
</body>
</html>
