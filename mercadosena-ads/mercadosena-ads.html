body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:20px;background:var(--surface);color:var(--on-surface);min-height:100vh;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--primary);text-decoration:none}
h1,h2,h3,h4,p{margin:0}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:middle}
svg.i.s14{width:14px;height:14px}svg.i.s16{width:16px;height:16px}svg.i.s18{width:18px;height:18px}svg.i.s24{width:24px;height:24px}svg.i.s32{width:32px;height:32px}
.hide{display:none!important}.grow{flex:1;min-width:0}.nowrap{white-space:nowrap}.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;align-items:center;gap:8px}.row-top{display:flex;align-items:flex-start;gap:8px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column}.gap4{gap:4px}.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.center{text-align:center}.right{text-align:right}
.t-xs{font-size:10px;line-height:12px;font-weight:700}.t-sm{font-size:12px;line-height:16px}.t-lbl{font-size:12px;line-height:16px;font-weight:600}.t-md{font-size:14px;line-height:20px}.t-lblm{font-size:14px;font-weight:600}
.t-h3{font-size:18px;line-height:24px;font-weight:600}.t-h2{font-size:22px;line-height:28px;font-weight:700}.t-m{font-size:20px;line-height:24px;font-weight:700}.t-display{font-size:32px;line-height:38px;font-weight:800}
.b{font-weight:700}.xb{font-weight:800}.up{text-transform:uppercase;letter-spacing:.06em}
.c-sec{color:var(--secondary)}.c-pri{color:var(--primary)}.c-prc{color:var(--primary-container)}.c-err{color:var(--error)}.c-ter{color:var(--tertiary)}.c-amb{color:var(--amber-fg)}.c-var{color:var(--on-surface-variant)}

/* Shell */
#app{min-height:100vh}
.header{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(248,249,255,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 1px 8px rgba(0,0,0,.04);height:var(--head-h)}
.header-in{height:100%;max-width:1200px;margin:0 auto;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo-wrap{display:flex;align-items:center;gap:8px;min-width:0}
.logo{height:36px;flex-shrink:0;display:block}.logo svg{display:block;height:100%;width:auto}
.head-title{min-width:0;display:flex;flex-direction:column}
.head-title .lab{color:var(--primary-container);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;line-height:12px}
.head-title .ttl{font-size:16px;font-weight:600;line-height:20px}
.icon-btn{position:relative;width:44px;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--on-surface);transition:background .15s}
.icon-btn:hover{background:var(--surface-c)}
.dot-badge{position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:50%;background:var(--error);box-shadow:0 0 0 2px var(--surface)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center}
.main{padding:calc(var(--head-h) + 16px) 16px calc(var(--nav-h) + 24px);max-width:1200px;margin:0 auto}
.page{display:flex;flex-direction:column;gap:16px;max-width:760px;margin:0 auto}
.page.wide{max-width:1100px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(248,249,255,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 -2px 12px rgba(11,28,48,.06);padding-bottom:env(safe-area-inset-bottom,0)}
.nav-in{display:flex;justify-content:space-around;align-items:center;height:var(--nav-h);padding:0 4px}
.nav a,.nav button.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:48px;color:var(--on-surface-variant);font-size:10px;font-weight:700;gap:2px;transition:color .15s;min-width:0}
.nav a.on{color:var(--primary-container)}
.side{display:none}
@media(min-width:900px){
  :root{--nav-h:0px}
  .nav{display:none}
  .side{display:flex;position:fixed;top:var(--head-h);left:0;bottom:0;width:232px;flex-direction:column;gap:2px;padding:16px 12px;overflow:auto;border-right:1px solid var(--surface-c);background:var(--surface)}
  .side a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--on-surface-variant);font-weight:600}
  .side a:hover{background:var(--surface-c)}
  .side a.on{background:var(--surface-lowest);color:var(--primary);box-shadow:var(--shadow-sm)}
  .side .sep{height:1px;background:var(--surface-c);margin:8px 4px}
  .main{padding:calc(var(--head-h) + 24px) 32px 48px 264px;max-width:none}
  .logo{height:40px}
  .page{max-width:900px}
}
@media(max-width:520px){.head-title{display:none}.logo{height:34px}}

/* Componentes */
.card{background:var(--surface-lowest);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow-sm)}
.card.flat{box-shadow:none;background:var(--surface-low)}
.card.hl{border:2px solid var(--primary-container)}
.banner{background:var(--surface-low);border-radius:var(--r-lg);padding:16px;position:relative;overflow:hidden;box-shadow:var(--shadow-sm)}
.banner::after{content:'';position:absolute;right:-16px;bottom:-16px;width:96px;height:96px;border-radius:50%;background:rgba(138,253,93,.3);filter:blur(24px);pointer-events:none}
.num{width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;font-weight:600;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 18px;border-radius:var(--r);font-weight:600;font-size:14px;transition:all .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--primary-container);color:#fff;box-shadow:var(--shadow-sm)}.btn.pri:hover{background:var(--primary)}
.btn.sec{background:var(--surface-high);color:var(--primary)}.btn.sec:hover{background:var(--surface-highest)}
.btn.gho{background:var(--surface-c);color:var(--on-surface-variant)}.btn.gho:hover{background:var(--surface-high)}
.btn.out{background:var(--surface-lowest);box-shadow:inset 0 0 0 1px var(--outline-variant)}
.btn.dng{background:var(--error-container);color:#93000a}
.btn.sm{min-height:32px;padding:6px 12px;font-size:12px}
.btn.blk{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;background:var(--surface-c);color:var(--on-surface-variant);font-size:12px;font-weight:600;white-space:nowrap;transition:all .15s;min-height:32px}
.chip:hover{background:var(--surface-high)}
.chip.on{background:var(--primary-container);color:#fff;box-shadow:var(--shadow-sm)}
.chip.soft{background:var(--primary-fixed);color:#052100}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips.wrapped{flex-wrap:wrap;overflow:visible}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.badge.ok{background:var(--primary-fixed);color:#052100}.badge.warn{background:var(--amber-bg);color:var(--amber-fg)}.badge.bad{background:var(--error-container);color:#93000a}.badge.info{background:#dbe1ff;color:#00174b}.badge.mut{background:var(--secondary-container);color:#3f465c}
.search{position:relative}
.search input{width:100%;height:44px;padding:0 40px;border-radius:var(--r);border:0;background:var(--surface-lowest);box-shadow:var(--shadow-sm);outline:none}
.search input:focus{box-shadow:0 0 0 2px var(--primary-container)}
.search .ic{position:absolute;left:12px;top:12px;color:var(--secondary)}
.search .clr{position:absolute;right:8px;top:6px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--secondary)}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-size:12px;font-weight:700;color:var(--on-surface-variant)}
.inp,.sel,.txt{width:100%;min-height:44px;padding:10px 12px;border-radius:var(--r);border:0;background:var(--surface-low);outline:none;box-shadow:inset 0 0 0 1px var(--surface-highest);transition:box-shadow .15s}
.inp:focus,.sel:focus,.txt:focus{box-shadow:inset 0 0 0 2px var(--primary-container);background:#fff}
.txt{min-height:110px;resize:vertical;line-height:20px}
.hint{font-size:12px;color:var(--secondary);line-height:16px}
.err{font-size:12px;color:var(--error)}
.counter{font-size:11px;color:var(--secondary);text-align:right}
.counter.ok{color:var(--primary)}.counter.bad{color:var(--error)}
.switch{position:relative;width:44px;height:24px;border-radius:999px;background:var(--secondary-fixed-dim);flex-shrink:0;transition:background .2s;display:inline-block}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch.on{background:var(--primary-container)}.switch.on::after{transform:translateX(20px)}
.switch-wrap{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 8px}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.bento{background:var(--surface-low);border-radius:var(--r);padding:8px}
.stat{background:var(--surface-low);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:10px;font-weight:700;color:var(--secondary);text-transform:uppercase;letter-spacing:.03em}
.stat .v{font-size:20px;line-height:24px;font-weight:700}
.stat .s{font-size:12px;color:var(--secondary)}
.kv{display:flex;flex-direction:column}.kv .k{font-size:10px;font-weight:700;color:var(--secondary)}.kv .v{font-size:14px;font-weight:700}
.thumb{width:64px;height:64px;border-radius:var(--r);object-fit:cover;background:var(--surface-c);flex-shrink:0}
.thumb.sm{width:48px;height:48px}.thumb.lg{width:100%;height:auto;aspect-ratio:1}
.thumbwrap{position:relative;flex-shrink:0}
.thumbwrap .tag{position:absolute;bottom:4px;right:4px;padding:0 4px;border-radius:4px;background:rgba(11,28,48,.8);color:#fff;font-size:10px;font-weight:700}
.status{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:var(--r);background:var(--surface-low)}
.status.ok{background:rgba(138,253,93,.2)}.status.warn{background:var(--amber-bg)}.status.bad{background:var(--error-container)}
.pulse{position:relative;width:10px;height:10px;flex-shrink:0}.pulse i{position:absolute;inset:0;border-radius:50%;background:var(--tertiary)}.pulse i:first-child{background:var(--tertiary-container);animation:ping 1.4s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{75%,100%{transform:scale(2.2);opacity:0}}
.dotg{width:10px;height:10px;border-radius:50%;background:var(--primary-container);flex-shrink:0}.dotg.pu{animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.hero{border-radius:var(--r-lg);padding:16px;color:#fff;background:linear-gradient(90deg,#39a900,#226d00);box-shadow:var(--shadow-md);position:relative;overflow:hidden}
.hero .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}.hero .bar i{display:block;height:100%;background:var(--primary-fixed);border-radius:99px;transition:width .7s}
.swipe{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 6px;margin:0 -16px;scroll-snap-type:x mandatory;scrollbar-width:none}.swipe::-webkit-scrollbar{display:none}
.swipe>*{scroll-snap-align:start;flex:0 0 auto}
.kpi{width:210px;background:var(--surface-lowest);border-radius:var(--r-lg);padding:14px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:6px}
@media(min-width:900px){.swipe{flex-wrap:wrap;overflow:visible;margin:0;padding:0}.kpi{flex:1 1 160px;width:auto}}
.sheet-bg{position:fixed;inset:0;background:rgba(11,28,48,.45);z-index:90;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--surface-lowest);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0));animation:up .2s}
@media(min-width:900px){.sheet-bg{align-items:center}.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:0}}@keyframes fade{from{opacity:0}}
.menu-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;font-weight:600;color:var(--on-surface)}
.menu-item:hover{background:var(--surface-low)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:var(--shadow-xl);z-index:120;font-weight:600;max-width:90vw;animation:up .2s;display:flex;gap:8px;align-items:center}
.sticky-bar{position:sticky;bottom:calc(var(--nav-h) + 8px);z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-radius:var(--r-lg);padding:8px 8px 8px 16px;box-shadow:var(--shadow-xl);display:flex;align-items:center;justify-content:space-between;gap:8px}
@media(min-width:900px){.sticky-bar{bottom:16px}.toast{bottom:24px}}
.stepper{display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;padding:2px}
.stepper::-webkit-scrollbar{display:none}
.step{display:flex;align-items:center;gap:6px;flex-shrink:0;color:var(--secondary);font-size:12px;font-weight:600;cursor:pointer}
.step .c{width:26px;height:26px;border-radius:50%;background:var(--surface-high);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.step.on{color:var(--primary)}.step.on .c{background:var(--primary-container);color:#fff}
.step.done .c{background:var(--primary-fixed);color:#052100}
.step .l{display:none}.step.on .l{display:inline}
@media(min-width:700px){.step .l{display:inline}}
.step-sep{width:14px;height:2px;background:var(--surface-highest);flex-shrink:0}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:2px solid var(--surface-c)}.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 14px;font-weight:700;font-size:13px;color:var(--secondary);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab.on{color:var(--primary);border-color:var(--primary-container)}
.opt{display:flex;align-items:flex-start;gap:12px;padding:14px;border-radius:var(--r-lg);background:var(--surface-lowest);box-shadow:var(--shadow-sm);cursor:pointer;position:relative;transition:box-shadow .15s;border:2px solid transparent}
.opt:hover{box-shadow:var(--shadow-md)}.opt.on{border-color:var(--primary-container)}
.radio{width:20px;height:20px;border-radius:50%;background:var(--surface-c);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.radio i{width:8px;height:8px;border-radius:50%;background:transparent}
.opt.on .radio{background:var(--primary-container)}.opt.on .radio i{background:#fff}
.cbx{width:20px;height:20px;border-radius:5px;background:var(--surface-c);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;margin-top:1px}
.opt.on .cbx{background:var(--primary-container)}
.ribbon{position:absolute;top:-10px;right:14px;background:var(--primary-container);color:#fff;padding:2px 10px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.05em}
.gauge{position:relative;height:12px;border-radius:99px;background:var(--surface-c);display:flex;overflow:hidden;padding:2px}
.gauge .pin{position:absolute;top:-4px;width:10px;height:20px;border-radius:99px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.35);transition:left .3s;border:2px solid var(--primary)}
.prog{height:8px;border-radius:99px;background:var(--surface-c);overflow:hidden}.prog i{display:block;height:100%;background:var(--primary-container);border-radius:99px;transition:width .4s}
.tbl-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table.tbl{border-collapse:collapse;width:100%;font-size:12px}
.tbl th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--secondary);padding:8px 8px;white-space:nowrap;border-bottom:2px solid var(--surface-c)}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--surface-c);white-space:nowrap}
.tbl td.num,.tbl th.num{text-align:right}
.tbl tr.best td{background:rgba(138,253,93,.18)}
.tbl input.inp{min-height:34px;padding:4px 8px;width:92px;text-align:right}
.bars{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;height:150px;padding:0 4px;position:relative;border-bottom:1px solid var(--outline-variant)}
.bars .g{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bars .pair{display:flex;align-items:flex-end;gap:3px;flex:1;width:100%;justify-content:center}
.bars .b1,.bars .b2{width:min(18px,40%);border-radius:3px 3px 0 0;transition:height .4s}
.bars .b1{background:var(--surface-highest)}.bars .b2{background:var(--primary-container)}
.legend{display:flex;gap:16px;flex-wrap:wrap}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.more{width:48px;height:48px;border-radius:var(--r);background:var(--surface-high);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--on-surface-variant);flex-shrink:0}
.empty{text-align:center;padding:32px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ill{width:64px;height:56px;border-radius:12px;background:var(--surface-low);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.empty .ill i{display:block;height:8px;border-radius:99px}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.imgcell{position:relative;border-radius:var(--r);overflow:hidden;background:var(--surface-c);aspect-ratio:1}
.imgcell img{width:100%;height:100%;object-fit:cover;display:block}
.imgcell .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(11,28,48,.75);color:#fff;display:flex;align-items:center;justify-content:center}
.imgcell .ok,.imgcell .ko{position:absolute;left:4px;bottom:4px;font-size:10px;font-weight:800;padding:1px 6px;border-radius:99px}
.imgcell .ok{background:var(--primary-fixed);color:#052100}.imgcell .ko{background:var(--error-container);color:#93000a}
.addimg{aspect-ratio:1;border-radius:var(--r);border:2px dashed var(--outline-variant);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--secondary);font-size:11px;font-weight:700;background:var(--surface-low)}
.addimg:hover{border-color:var(--primary-container);color:var(--primary)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:12px}
.check .ic{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.check .ic.ok{background:var(--primary-container);color:#fff}.check .ic.no{background:var(--surface-high);color:var(--secondary)}.check .ic.mid{background:var(--amber);color:#fff}
.score{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex-shrink:0}
.kwrow{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface-low);border-radius:var(--r);flex-wrap:wrap}
.kwrow .sel{width:auto;min-height:34px;padding:4px 8px;font-size:12px}
.kwrow .inp.bid{width:80px;min-height:34px;padding:4px 8px;text-align:right}
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--surface-high);border-radius:var(--r-lg);padding:14px}
.tip .ic{width:36px;height:36px;border-radius:var(--r);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--primary-container);flex-shrink:0}
.concept{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.concept>div{background:var(--surface-lowest);border-radius:var(--r);padding:10px;box-shadow:var(--shadow-sm)}
@media(max-width:560px){.concept{grid-template-columns:1fr}}
.divider{height:1px;background:var(--surface-c);margin:4px 0}
.ok-txt{color:var(--primary);font-weight:700}.bad-txt{color:var(--error);font-weight:700}
.route-step{display:flex;gap:12px;align-items:flex-start}

  return { score, checks };
}

  if (a.demo.incomes.length) { inc = clamp(sum(a.demo.incomes, k => INCOMES[k][1]), .05, 1); const tier = p.price > 200000 ? 'alto' : p.price > 60000 ? 'medio' : 'bajo'; cvr *= a.demo.incomes.includes(tier) ? 1.15 : .9; }

/* ============ Palabras clave ============ */
function kwStats(term, p, camp) {
  const cat = CATS[p.cat] || CATS.alimentos; const n = norm(term); const words = n.split(/\s+/).filter(Boolean); const h = hash(n);
  const longTail = words.length >= 3;
  const volume = (2000 + h % 12000) * cat.demand / 900 * (words.length === 1 ? 1.5 : longTail ? .45 : 1);
  const marketCpc = cat.cpc * (.8 + (h % 40) / 100) * (words.length === 1 ? 1.25 : longTail ? .8 : 1);
  const ptxt = norm(p.title + ' ' + cat.name + ' ' + p.desc);
  const sig = words.filter(w => w.length > 2); const matched = sig.filter(w => ptxt.includes(w)).length;
  const rel = sig.length ? matched / sig.length : 0;
  const relF = .25 + rel * 1.15 + (longTail ? .1 : 0);

}

/* ============ Motor de simulación ============ */
// Una pasada de un día para un anuncio. rnd() decide el azar; en modo estimación rnd = () => .5
function adDay(camp, ad, p, dayIdx, share, rnd, est) {
  const aud = audienceStats(camp.audience, p), qf = qualityFactor(p), pf = priceFactor(p);

  const kws = ad.keywords.length ? ad.keywords : autoKeywords(p, camp.bid);
  const baseCvr = .012, baseCtr = .012;

  const perKw = [];
  kws.forEach(k => {
    const st = kwStats(k.term, p, camp), M = MATCH[k.match] || MATCH.frase;
    const nb = k.match === 'amplia' ? 1 + st.negBoost : 1;
    const cvr = baseCvr * qf * pf * ticketFactor(p) * M.cvr * aud.cvr * st.relF * nb;
    let bid = k.bid || camp.bid;
    if (camp.roasTarget) bid = Math.min(bid, p.price * cvr / camp.roasTarget); // la puja se limita para cumplir el ROAS objetivo
    const posF = Math.pow(clamp(bid / st.marketCpc, .1, 1.6), 1.3);
    const i = st.volume * M.reach * Math.pow(aud.reach, .6) * posF * learning * (.85 + .3 * rnd()) * .5 / Math.max(1, kws.length * .6);
    const ctr = clamp(baseCtr * qf * M.ctr * aud.ctr * st.relF * nb * (.9 + .2 * rnd()), .002, .08);
    const c = i * ctr; const cpc = bid * (.7 + .2 * rnd()) / learning;
    imp += i; clk += c; cost += c * cpc; exp += c * cvr;

  const cap = camp.budgetDaily * share;
  if (cost > cap && cost > 0) { const k = cap / cost; imp *= k; clk *= k; cost *= k; exp *= k; }
  let sales = est ? exp : Math.floor(exp) + (rnd() < exp - Math.floor(exp) ? 1 : 0);
  if (!est) { sales = Math.min(sales, p.stock); imp = Math.round(imp); clk = Math.min(Math.round(clk), imp); cost = Math.round(cost); }
  return { imp, clicks: clk, cost, sales, revenue: sales * p.price, capped: cost >= cap * .98 };
}
const activeAds = c => c.ads.filter(a => a.active && prodById(a.productId));
function stepDay() {
  const day = S.sim.day; let orgS = 0, orgR = 0;
  S.products.forEach(p => {
    const cat = CATS[p.cat] || CATS.alimentos; const r = rng(hash(p.id + 'org' + day));
    const lift = S.campaigns.some(c => c.status === 'active' && c.ads.some(a => a.productId === p.id && a.active)) ? 1.15 : 1;
    const pot = (cat.demand / 900) * 1.1 * qualityFactor(p) * priceFactor(p) * lift * (.7 + .6 * r());
    let s = Math.floor(pot) + (r() < pot - Math.floor(pot) ? 1 : 0); s = Math.min(s, p.stock);
    p.stock -= s; orgS += s; orgR += s * p.price;

  S.sim.organic[day] = { sales: orgS, revenue: orgR };
  S.campaigns.forEach(c => {
    if (c.status !== 'active') return;
    if (day - c.startDay >= c.durationDays) { c.status = 'ended'; return; }
    const ads = activeAds(c).filter(a => prodById(a.productId).stock > 0);
    c.ads.forEach(a => { if (a.active && prodById(a.productId) && prodById(a.productId).stock <= 0) a.active = false; });
    const tot = ads.length;
    ads.forEach(a => {
      const p = prodById(a.productId); const r = rng(hash(a.id + 'd' + day));
      const m = adDay(c, a, p, day, 1 / tot, r, false);

    c.ads.forEach(a => { if (!a.daily[day]) a.daily[day] = { imp: 0, clicks: 0, cost: 0, sales: 0, revenue: 0 }; });

}

/* ============ Agregación de métricas ============ */

function adMetrics(ad, from = 0, to = Infinity) {

}

  m.cvr = m.clicks ? m.sales / m.clicks * 100 : 0; return m;
}
function campMetrics(c, from = 0, to = Infinity) {

}

}

function qualityBox(p) {

}
function cornersLight(c) {
  const x = c.getContext('2d'); const pts = [[0, 0], [c.width - 10, 0], [0, c.height - 10], [c.width - 10, c.height - 10]]; let L = 0;
  pts.forEach(([a, b]) => { const d = x.getImageData(a, b, 10, 10).data; let s = 0; for (let i = 0; i < d.length; i += 4) s += d[i] * .299 + d[i + 1] * .587 + d[i + 2] * .114; L += s / (d.length / 4); });
  return L / 4 > 225;
}
function processImage(file) {
  return new Promise((res, rej) => {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return rej('Formato no permitido. Usa JPG, PNG o WebP.');
    if (file.size > 5 * 1024 * 1024) return rej('Pesa más de 5 MB.');
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const w = img.naturalWidth, h = img.naturalHeight; URL.revokeObjectURL(url);
      if (w < 500 || h < 500) return rej(`Resolución ${w}×${h} px. El mínimo es 500×500 px.`);
      const s = Math.min(1, 800 / Math.max(w, h)); const c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      res({ src: c.toDataURL('image/jpeg', .72), w, h, ok: true, bg: cornersLight(c) });
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej('No se pudo leer el archivo.'); };
    img.src = url;
  });
}
function sampleImage(p, v) {
  const c = document.createElement('canvas'); c.width = c.height = 800; const x = c.getContext('2d'); const cat = CATS[p.cat] || CATS.alimentos;
  const bgs = [['#ffffff', '#eaf6e3'], ['#d9f7c6', '#39a900'], ['#fdf3dc', '#e8c98a'], ['#e5eeff', '#668eff']][v % 4];
  const g = x.createRadialGradient(400, 400, 40, 400, 400, 560); g.addColorStop(0, bgs[0]); g.addColorStop(1, bgs[1]);
  x.fillStyle = v % 4 === 0 ? '#fff' : g; x.fillRect(0, 0, 800, 800);
  if (v % 4 === 0) { x.fillStyle = g; x.beginPath(); x.arc(400, 380, 300, 0, 7); x.fill(); }
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.font = (v % 4 === 2 ? 440 : 300) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; x.fillText(cat.emoji, 400, v % 4 === 2 ? 380 : 360);
  x.fillStyle = '#0f172a'; x.font = '800 38px "Plus Jakarta Sans",sans-serif';
  const words = (p.title || 'Producto').split(' '); const lines = ['', '']; let li = 0; words.forEach(w => { if ((lines[li] + ' ' + w).length > 26 && li < 1) li++; lines[li] = (lines[li] + ' ' + w).trim(); });
  lines.forEach((l, i) => { if (l) x.fillText(l.slice(0, 30), 400, 640 + i * 48); });
  x.fillStyle = '#39a900'; x.font = '700 24px "Plus Jakarta Sans",sans-serif'; x.fillText(['Vista frontal', 'Detalle', 'En uso', 'Empaque'][v % 4], 400, 745);
  return { src: c.toDataURL('image/jpeg', .7), w: 800, h: 800, ok: true, bg: v % 4 === 0 };
}

const newCamp = () => ({ id: uid('CAMP'), name: 'Campaña ' + (S.campaigns.length + 1), objective: 'ventas', roasTarget: 3, status: 'draft', budgetDaily: 10000, durationDays: 30, bid: 180, startDay: 0, audience: blankAudience(), groups: [{ id: uid('BLQ'), name: 'Bloque 1' }], ads: [], negatives: [], step: 1, createdAt: Date.now() });
function addAdTo(c, pid, gid) { if (c.ads.some(a => a.productId === pid)) return; c.ads.push({ id: uid('AD'), productId: pid, groupId: gid || c.groups[0].id, active: true, keywords: [], daily: [] }); }
function startDraft(ids) { S.draft = newCamp(); (ids || []).forEach(id => addAdTo(S.draft, id)); save(); }
const WSTEPS = ['Datos', 'Pauta', 'Audiencia', 'Palabras clave', 'Presupuesto', 'Lanzamiento'];

function validateCamp(c) {
  const e = [], w = [];
  if (!c.name.trim()) e.push('Escribe un nombre para la campaña.');
  if (!c.ads.length) e.push('Selecciona al menos un producto para promocionar.');
  if (c.budgetDaily < 5000) e.push('El presupuesto diario mínimo es de $ 5.000 COP.');
  if (c.bid < 50) e.push('La puja base mínima es de $ 50 COP por clic.');
  if (c.durationDays < 1) e.push('La duración debe ser de al menos 1 día.');
  if (c.audience.geo.scope === 'ciudades' && !c.audience.geo.cities.length) e.push('Elige al menos una ciudad o cambia a cobertura nacional.');
  if (c.audience.demo.ageMin > c.audience.demo.ageMax) e.push('La edad mínima no puede superar la máxima.');
  if (c.audience.demo.genders.length === 0) e.push('Selecciona al menos un género.');
  c.ads.forEach(a => { const p = prodById(a.productId); if (!p) return; if (!a.keywords.length) w.push(`"${p.title}" no tiene palabras clave: se usará segmentación automática.`); if (productQuality(p).score < 50) w.push(`"${p.title}" tiene calidad baja (${productQuality(p).score}). Gastarás más por cada venta.`); });
  if (c.budgetDaily < c.bid * 10) w.push('Tu presupuesto diario alcanza para menos de 10 clics. Considera aumentarlo.');
  return { e, w };
}
function launch(c) {
  const v = validateCamp(c); if (v.e.length) { toast(v.e[0], 'warn'); return false; }
  c.status = 'active'; c.startDay = S.sim.day; delete c.step;
  if (S.draft && S.draft.id === c.id) { S.campaigns.push(c); S.draft = null; }
  save(); toast('Campaña lanzada. Simula días para ver resultados.'); go('#/campanas/' + c.id + '/resultados'); return true;
}

  return `<div class="row between"><div class="t-lblm b">Alcance estimado</div><span class="badge ${lvl[0]}">Audiencia ${lvl[1]}</span></div>
  <div class="t-display" style="font-size:26px">${compact(Math.round(reach * AUDIENCE_BASE))} <span class="t-sm c-sec" style="font-weight:600">personas por día</span></div>
  <div class="prog"><i style="width:${Math.max(2, reach * 100)}%"></i></div>

/* ============ Anuncios ============ */

};
VIEWS.anuncios_after = () => {

ACT.sortAds = el => { UI.adsSort = el.dataset.k; rerender(); };
ACT.applyAds = () => { let n = 0; Object.entries(UI.pending).forEach(([id, v]) => { const f = findAd(id); if (f && f.ad.active !== v) { f.ad.active = v; n++; } }); UI.pending = {}; save(); toast(n ? `Se aplicaron ${n} cambio${n > 1 ? 's' : ''}` : 'Sin cambios'); rerender(); };

/* ============ Detalle de un anuncio ============ */
function coach(a, p, c, m) {
  const t = [], be = margin(p);
  if (!m.imp) return ['Aún no hay datos. Simula días para recibir recomendaciones.'];
  if (m.sales === 0 && m.clicks > 40) t.push('Tiene clics pero ninguna venta. Revisa precio, descripción y fotos: el problema está después del clic.');
  if (isFinite(m.acos) && m.acos > be) t.push(`El ACOS (${pct(m.acos)}) supera el margen (${pct(be)}): cada venta te deja pérdida. Baja la puja, mejora la publicación o pausa el anuncio.`);
  else if (isFinite(m.acos) && m.acos <= be * .5) t.push(`Muy rentable: el ACOS (${pct(m.acos)}) es menos de la mitad del margen. Puedes subir presupuesto o puja para ganar más volumen.`);
  if (m.ctr < .8) t.push('El CTR es bajo (' + pct(m.ctr, 2) + '). Mejora el título y la foto principal, o usa coincidencia más precisa.');
  if (m.clicks > 40 && m.cvr < 1.5) t.push('La conversión es baja (' + pct(m.cvr, 2) + '). Revisa el precio frente a la competencia y completa la descripción.');
  if (productQuality(p).score < 70) t.push(`La calidad de la publicación es ${productQuality(p).score}/100. Mejorarla reduce el costo por venta.`);
  const k = a.keywords; if (!k.length) t.push('No tiene palabras clave propias. Agrega términos específicos para controlar a quién llegas.');
  if (!t.length) t.push('El anuncio rinde dentro de lo esperado. Sigue monitoreando el ACOS semanalmente.');
  return t;
}

};

/* ============ Calculadora ACOS ============ */

  <div class="col gap12" role="radiogroup" aria-label="Opciones de ROAS">
  ${opt('2', '2x', 'Volumen', 'mut', 'Más ventas con menor rentabilidad', false, 'checkc')}${opt('3', '3x', 'Ideal SENA', 'ok', 'Equilibrado · Maximiza la exposición manteniendo margen saludable', true, 'checkc')}${opt('10', '10x', 'Alto margen', 'warn', 'Menos ventas con mayor rentabilidad', false, 'warn')}
  <div class="opt ${ROASUI.sel === 'custom' ? 'on' : ''}" data-act="roasPick" data-k="custom" role="radio" aria-checked="${ROASUI.sel === 'custom'}" tabindex="0" style="flex-direction:column;gap:8px"><div class="row between" style="width:100%"><div class="row gap12"><div class="radio"><i></i></div><span class="t-h3">Definir otro</span></div><span class="badge mut">Personalizado</span></div><div style="padding-left:32px;width:100%"><div class="row gap8" style="background:var(--surface-low);padding:6px 12px;border-radius:8px"><input id="roascustom" type="number" step="0.1" min="1" max="25" class="inp" style="background:transparent;box-shadow:none;min-height:32px;padding:0" placeholder="Ingresar (ej. 4.5)" value="${esc(ROASUI.custom)}"><span class="b c-var">x</span></div><span class="t-xs c-var mt4" style="display:block">Rango recomendado: 2.0x a 12.0x</span></div></div></div>
  <section class="card flat row gap12"><div class="num" style="background:rgba(57,169,0,.2);color:var(--primary-container)">${ic('chart', 's18')}</div><div class="col grow"><span class="t-lbl b">Impacto estimado del cambio</span><span class="t-sm c-var" id="roasproj">${roasProj(c, v)}</span></div></section>
  <div class="col gap8"><button class="btn pri blk" style="min-height:48px" data-act="saveRoas" data-id="${c.id}">${ic('send', 's18')} Guardar ROAS objetivo</button><a class="btn gho blk" href="#/campanas">Cancelar</a></div></div>`;
};
function roasProj(c, v) {
  if (!(v >= 1) || !c.ads.length) return 'Agrega anuncios a la campaña para estimar el impacto.';
  const a = campEstimate(c), b = campEstimate(c, { roasTarget: v }); const d = a.imp ? (b.imp - a.imp) / a.imp * 100 : 0; const ds = a.sales ? (b.sales - a.sales) / a.sales * 100 : 0;
  return `${d >= 0 ? '+' : ''}${d.toFixed(0)}% impresiones · ${ds >= 0 ? '+' : ''}${ds.toFixed(0)}% ventas diarias · ACOS estimado ${pct(b.acos)} (hoy ${pct(a.acos)}). ${v < c.roasTarget ? 'Más volumen, menos margen.' : v > c.roasTarget ? 'Menos volumen, más margen.' : 'Sin cambios.'}`;
}
VIEWS.roas_after = r => { const i = $('#roascustom'); if (i) i.addEventListener('input', () => { ROASUI.sel = 'custom'; ROASUI.custom = i.value; const c = campById(r.a); const v = num(i.value); $('#roasbadge').textContent = (v || '—') + 'x'; $('#roasproj').textContent = roasProj(c, v); $('#gpin').style.left = `calc(${10 + (clamp(v, 2, 10) - 2) / 8 * 80}% - 5px)`; $$('.opt[data-act="roasPick"]').forEach(o => { const on = o.dataset.k === 'custom'; o.classList.toggle('on', on); o.setAttribute('aria-checked', on); }); }); };
ACT.roasPick = (el, e) => { if (e.target.id === 'roascustom') { ROASUI.sel = 'custom'; return; } ROASUI.sel = el.dataset.k; if (el.dataset.k === 'custom') { rerender(); setTimeout(() => { const i = $('#roascustom'); if (i) i.focus(); }, 0); } else rerender(); };
ACT.saveRoas = el => { const c = campById(el.dataset.id); const v = ROASUI.sel === 'custom' ? num(ROASUI.custom) : +ROASUI.sel; if (!(v >= 1 && v <= 25)) return toast('Ingresa un ROAS entre 1 y 25', 'warn'); c.roasTarget = v; save(); toast(`ROAS objetivo guardado: ${v}x`); go('#/campanas'); };

/* ============ Datos y descarga ============ */
function download(name, text, type) { const b = new Blob([text], { type: type + ';charset=utf-8' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800); }
VIEWS.datos = () => `<div class="page">${pageHead('Datos y descarga')}
  <section class="card col gap12"><div class="row gap12"><div class="num">${ic('download', 's18')}</div><div><h3 class="t-h3">Descargar el simulador (HTML portable)</h3><p class="c-var">Un solo archivo que funciona sin internet en celular, tableta y computador. Compártelo por correo, WhatsApp o memoria USB.</p></div></div><button class="btn pri" data-act="dlApp">${ic('download', 's18')} Descargar mercadosena-ads.html</button></section>
  <section class="card col gap12"><h3 class="t-h3">Tu proyecto</h3><p class="c-var">Guarda tu trabajo (productos, campañas, resultados y reportes) en un archivo para entregarlo al instructor o continuar en otro dispositivo.</p><div class="row gap8 wrap"><button class="btn sec" data-act="expData">${ic('download', 's16')} Exportar proyecto (.json)</button><label class="btn sec" tabindex="0">${ic('upload', 's16')} Importar proyecto<input type="file" id="impfile" accept="application/json,.json" hidden></label></div></section>
  <section class="card col gap12"><h3 class="t-h3">Práctica</h3><div class="row gap8 wrap"><button class="btn sec" data-act="practice">${ic('zap', 's16')} Cargar caso práctico</button><button class="btn dng" data-act="reset">${ic('trash', 's16')} Reiniciar simulador</button></div><p class="hint">El caso práctico reemplaza tu trabajo actual con 6 productos, 3 campañas y 30 días de resultados.</p></section>
  <section class="card flat col gap8"><h3 class="t-h3">Cómo funciona la simulación</h3><p class="t-sm c-var">Cada día simulado, el motor calcula impresiones según el volumen de búsqueda de cada palabra clave, tu puja frente al mercado, la audiencia elegida y la calidad de la publicación. De ahí salen clics (CTR), costo (CPC), ventas (conversión) y ACOS. Si el costo supera el presupuesto diario, se recorta. Los primeros ${LEARN_DAYS} días la campaña está en aprendizaje y rinde menos. Con ROAS objetivo, la puja se limita para no pagar más de lo rentable.</p></section></div>`;
VIEWS.datos_after = () => { const f = $('#impfile'); if (f) f.addEventListener('change', async () => { const file = f.files[0]; if (!file) return; try { const o = JSON.parse(await file.text()); if (!o || o.v !== 1 || !Array.isArray(o.products)) throw 0; confirmBox('Importar proyecto', 'Reemplazará todo tu trabajo actual.', 'Importar', () => { S = Object.assign(blank(), o); save(); toast('Proyecto importado'); go('#/inicio'); }); } catch (e) { toast('El archivo no es un proyecto válido', 'warn'); } }); };
ACT.dlApp = () => download('mercadosena-ads.html', ORIGINAL_HTML, 'text/html');
ACT.expData = () => download('proyecto-mercadosena-ads.json', JSON.stringify(S), 'application/json');
ACT.reset = () => confirmBox('Reiniciar simulador', 'Se borrarán productos, campañas, resultados y reportes.', 'Reiniciar', () => { S = blank(); PD = null; RPT = null; UI.pending = {}; save(); toast('Simulador reiniciado'); go('#/inicio'); });
ACT.practice = () => confirmBox('Cargar caso práctico', 'Reemplazará tu trabajo actual por datos de ejemplo.', 'Cargar', () => { loadPractice(); toast('Caso práctico cargado: 30 días simulados'); go('#/metricas'); });

/* ============ Caso práctico ============ */
function loadPractice() {
  S = blank(); PD = null; RPT = null; UI.pending = {};
  const mk = (title, cat, price, cost, stock, desc, nimg) => { const p = { id: String(Math.floor(100000000 + Math.random() * 900000000)), title, desc, cat, price, cost, stock, images: [] }; for (let i = 0; i < nimg; i++) p.images.push(sampleImage(p, i)); S.products.push(p); return p; };
  const cafe = mk('Café Especial Origen Huila Tostión Media 500 g', 'alimentos', 38000, 27000, 900, 'Café de altura cultivado por familias del Huila, tostión media con notas a panela, cacao y frutos rojos. Empaque con válvula que conserva la frescura. Ideal para prensa francesa, V60 y cafetera de goteo. Trazabilidad por lote.', 3);
  const miel = mk('Miel de Abejas Pura 1 kg', 'alimentos', 42000, 31000, 600, 'Miel natural.', 1);
  const hidro = mk('Hidrolavadora Portátil Multi-Uso SENA Pro 1800 W', 'herramientas', 246500, 190000, 300, 'Hidrolavadora eléctrica de 1800 W y 120 bar para limpieza de fachadas, vehículos, patios y maquinaria agrícola. Incluye manguera de 5 metros, lanza ajustable y garantía de un año con soporte técnico.', 3);
  const panela = mk('Panela Orgánica Artesanal en Bloque 1 kg', 'alimentos', 12000, 9000, 1200, 'Panela orgánica elaborada en trapiche familiar sin químicos ni aditivos. Bloque de un kilo, ideal para aguapanela, repostería y bebidas calientes. Empaque sellado con hoja de bijao.', 2);
  const mochila = mk('Mochila Wayuu Tejida a Mano Mediana Colores Vivos', 'artesanias', 95000, 62000, 120, 'Mochila tejida a mano por artesanas wayuu de La Guajira, hilo de algodón resistente, correa ajustable y diseño único. Mide 30 por 30 centímetros. Cada pieza es irrepetible.', 3);
  const aceite = mk('Aceite Esencial de Lavanda Orgánico 30 ml', 'belleza', 28000, 15000, 400, 'Aceite esencial de lavanda 100% puro, destilado al vapor, en frasco de vidrio ámbar con gotero. Para aromaterapia, difusores, masajes diluidos y descanso nocturno. Libre de parabenos y fragancias.', 2);
  const aud = f => { const a = blankAudience(); f(a); a.touched = true; return a; };
  const camp = (name, roas, budget, bid, audience, ads, groups, neg) => { const c = newCamp(); c.name = name; c.roasTarget = roas; c.budgetDaily = budget; c.bid = bid; c.audience = audience; c.groups = groups.map(g => ({ id: uid('BLQ'), name: g })); ads.forEach(([p, gi, kws]) => { addAdTo(c, p.id, c.groups[gi].id); c.ads[c.ads.length - 1].keywords = kws.map(([t, m, b]) => ({ term: t, match: m, bid: b || bid })); }); c.negatives = neg || []; c.status = 'active'; c.startDay = 0; c.durationDays = 90; delete c.step; S.campaigns.push(c); return c; };
  camp('Emprendedores SENA Agro', 3, 20000, 200, aud(a => { }), [[cafe, 0, [['café especial', 'frase'], ['café huila 500 g', 'exacta', 220]]], [hidro, 1, [['hidrolavadora portátil', 'frase', 260], ['hidrolavadora 1800 w', 'exacta', 280]]], [panela, 1, [['panela orgánica', 'frase', 150]]]], ['Línea Café', 'Herramientas y despensa'], ['usado', 'repuesto']);
  camp('Línea Café y Miel', 5, 12000, 160, aud(a => { a.behavior.buyers = ['plataforma', 'tienda']; a.behavior.interests = ['alimentos', 'gourmet']; }), [[cafe, 0, [['café', 'amplia', 150], ['café de origen', 'frase']]], [miel, 0, [['miel', 'amplia', 150]]]], ['Bloque 1']);
  camp('Bienestar y Artesanías', 2, 10000, 140, aud(a => { a.geo.scope = 'ciudades'; a.geo.cities = ['Bogotá', 'Medellín', 'Cali']; a.demo.ageMin = 25; a.demo.ageMax = 54; a.demo.genders = ['mujer']; a.behavior.interests = ['regalos', 'belleza']; }), [[mochila, 0, [['mochila wayuu', 'exacta', 170], ['mochila artesanal', 'frase']]], [aceite, 1, [['aceite esencial lavanda', 'frase', 150]]]], ['Artesanías', 'Bienestar'], []);
  advance(30);
}

/* ============ Arranque ============ */
load();
window.addEventListener('hashchange', () => { if (UI.live) { clearInterval(UI.live); UI.live = null; } render(); });
if (!location.hash) location.hash = '#/inicio'; else render();
</script>
</body>
</html>
